name: Automated 24-Hour Leaderboard Update

on:
  schedule:
    # Runs automatically every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Leaderboard Ingestion Pipeline
        run: node scripts/updateLeaderboard.js

      - name: Commit and push updated leaderboard data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Leaderboard Bot]"
          git add public/leaderboard_data.json data/leaderboard.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(leaderboard): automated 24-hour evaluation dataset update [skip ci]" && git push)
