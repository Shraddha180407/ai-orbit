name: PR Syntax & Type Check

on:
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Check Backend Syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma & Check Types
        run: npm run build

  frontend-check:
    name: Check Frontend Syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Check Types (No Secrets Required)
        run: npx tsc --noEmit