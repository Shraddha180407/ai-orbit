<svg width="180" height="42" viewBox="0 0 180 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(21 21) rotate(90) scale(18)">
      <stop stop-color="#6E56CF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6E56CF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit-grad" x1="6" y1="12" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#6E56CF"/>
      <stop offset="1" stop-color="#3B2D7D"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="15" y1="15" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#826DEB"/>
      <stop offset="1" stop-color="#573EC2"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="21" cy="21" r="18" fill="url(#glow)" opacity="0.3"/>

  <!-- Tilted Orbit Ring 1 -->
  <ellipse cx="21" cy="21" rx="16" ry="7" transform="rotate(-28 21 21)" stroke="url(#orbit-grad)" stroke-width="2" stroke-dasharray="45 10"/>

  <!-- Tilted Orbit Ring 2 -->
  <ellipse cx="21" cy="21" rx="16" ry="7" transform="rotate(38 21 21)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2"/>

  <!-- Central Core -->
  <circle cx="21" cy="21" r="5" fill="url(#core-grad)"/>
  <circle cx="21" cy="21" r="2.2" fill="#FFFFFF"/>

  <!-- Orbital Particles -->
  <circle cx="33" cy="14" r="2" fill="#A78BFA"/>
  <circle cx="9" cy="28" r="1.5" fill="#00E5FF"/>

  <!-- Typography -->
  <text x="48" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="-0.03em">AI ORBIT</text>
  <circle cx="140" cy="17" r="2.5" fill="#6E56CF"/>
  <text x="49" y="34" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.16em">THE AI SIGNAL</text>
</svg>
